events {}
worker_processes auto;

http {
    # ---------------------------------------------------------------
    # Port 80: Let's Encrypt challenges for the IP certificate.
    # Keep this block permanently: the IP cert renews every few days.
    # ---------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name 103.188.82.92;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 404;
        }
    }

    # ===============================================================
    # Daily expense tracker app: https://103.188.82.92:2212
    # ===============================================================

    upstream expense_tracker_server {
        # <container name>:<port the app listens on INSIDE the container>
        server expense-tracker-prototype:80;
    }
    server {
        listen 2212 ssl;
        server_name 103.188.82.92;
        
        ssl_certificate     /etc/letsencrypt/live/103.188.82.92/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/103.188.82.92/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # http://103.188.82.92:2212 -> redirect to https instead of a 400 error
        error_page 497 =301 https://$host:$server_port$request_uri;
        
        location / {
            proxy_pass http://expense_tracker_server;
            
            # Keep the port in Host so the app's redirects/links stay on :2212
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}