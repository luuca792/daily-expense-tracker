# Run from implementation/deploy:  docker-compose up -d --build
# The image tag is the app version (app/package.json); build_and_push.py sets APP_VERSION from it.
# The host's nginx proxies the HTTPS subdomain to this port.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.3}
    image: luuca792/expense-tracker:${APP_VERSION:-1.0.3}
    container_name: expense-tracker
    ports:
      - "${HOST_PORT:-8081}:80"
    restart: unless-stopped
