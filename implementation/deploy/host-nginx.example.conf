# Example server block for the HOST nginx (the one holding the certificates), in its http { } block.
# Replace SUBDOMAIN with the final address. KEEP IT FOREVER: each phone's data belongs to this exact
# address (scheme + host + port). Moving means every friend must export and import (plan §6).
#
# The container must be on the same Docker network as the host nginx (or use 127.0.0.1:8081 below).

upstream so_chi_tieu {
    server so-chi-tieu:80;   # <container name>:<port inside the container>
}

server {
    listen 80;
    server_name SUBDOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SUBDOMAIN;

    ssl_certificate     /etc/letsencrypt/live/SUBDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SUBDOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://so_chi_tieu;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # keep the container's Cache-Control (sw.js, index.html: no-cache)
    }
}
